name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64)
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MyLife.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest MyLife.apk --title "My Life 1.0 (Android APK)" --notes "Download MyLife.apk on your Android phone and install it. Built from commit ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        with:
          name: MyLife-apk
          path: MyLife.apk
