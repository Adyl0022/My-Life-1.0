name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set base path for GitHub Pages
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('app.json'));d.expo.experiments={...(d.expo.experiments||{}),baseUrl:'/My-Life-1.0'};fs.writeFileSync('app.json',JSON.stringify(d,null,2));"
      - run: npx expo export --platform web
      - name: Make installable (PWA)
        run: |
          node -e "const fs=require('fs');let h=fs.readFileSync('dist/index.html','utf8');h=h.replace('</head>','<link rel=\"manifest\" href=\"/My-Life-1.0/manifest.webmanifest\"><meta name=\"theme-color\" content=\"#0a0f2c\"><link rel=\"apple-touch-icon\" href=\"/My-Life-1.0/icon-192.png\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><script>if(\"serviceWorker\" in navigator){window.addEventListener(\"load\",function(){navigator.serviceWorker.register(\"/My-Life-1.0/sw.js\")})}</script></head>');fs.writeFileSync('dist/index.html',h);"
          sed -i 's#"start_url": "./"#"start_url": "/My-Life-1.0/"#; s#"scope": "./"#"scope": "/My-Life-1.0/"#' dist/manifest.webmanifest
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
